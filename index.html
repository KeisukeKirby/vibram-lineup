          "価格: イベント在庫表の通常価格(Terminal 21 Asok ポップアップのポスターで、割引前に表示されている価格と同じ)。",
          "説明・特徴: vibram.com(英語)と barefootinc.jp(日本語)。タイ語は翻訳です。重量・ソール・アッパーは各サイトの表記。",
          "画像: vibram.com と barefootinc.jp の商品画像。両サイトに無い旧モデルはポスターの画像です。"],
    g:{W:"Women",M:"Men",U:"Unisex"}
  },
  en: {
    tabRegular:"Regular lineup", tabEvent:"Event only",
    noteRegular:"Footwear we always carry in store. Some colours are carried for one gender only.",
    noteEvent:"Colours and genders we have carried only at events. Includes regular models where a particular colour was event-only.",
    women:"Women", men:"Men", allCats:"All categories", search:"Model, colour or code",
    cat:{training:"Gym and training", running:"Walking and running", outdoor:"Outdoor, water and trail", casual:"Everyday and casual"},
    nModels:n=>`${n} ${n===1?"model":"models"}`, tabCount:(m,c)=>`${m} models · ${c} colours`, count:(m,c)=>`${m} models / ${c} colours`,
    stModels:"models", stColours:"colours (by gender)", stPrice:"list price range",
    listPrice:"list price", more:"Features & details", alsoRegular:"Other colours are regular",
    close:"Close", spec:"Spec", weight:"Weight", sole:"Sole", upper:"Upper",
    feats:"Features", carried:"Colours we carry", notCarried:"Other colours in the range (not carried)",

    rangeNote:"Colours currently listed on vibram.com. The range changes by season.",
    notListed:"This model is not listed on vibram.com, so the colours we do not carry cannot be shown.",
    noCopy:"An older model with no description left on the official sites. Only the name, price and the colours we carry are shown.",
    refModel:"Reference photo (other colour)", refGender:"Reference photo (other gender)", refPoster:"Poster image",
    jpSite:"barefootinc.jp", vibSite:"vibram.com",
    empty:"No models match. Reset the filters or try another search.",
    foot:t=>[`What we carry: the stock table (VFF Stock Dashboard, as of ${t}). Colours in stock are Regular; colours and genders with no stock there that appear in the September 2026 event stock sheet are Event.`,
          "Prices: list price from the event stock sheet (the same price shown struck through, before discount, on the Terminal 21 Asok popup poster).",
          "Copy and features: vibram.com (English) and barefootinc.jp (Japanese). Thai is translated. Weight, sole and upper are as stated on those sites.",
          "Images: product photos from vibram.com and barefootinc.jp. Older models on neither site use poster images."],
    g:{W:"Women",M:"Men",U:"Unisex"}
  },
  th: {
    tabRegular:"สินค้าประจำ", tabEvent:"เฉพาะอีเวนต์",
    noteRegular:"สินค้าที่ร้านมีจำหน่ายเป็นประจำ บางสีมีเฉพาะผู้หญิงหรือผู้ชาย",
    noteEvent:"สีหรือเพศที่ไม่มีในสินค้าประจำ แต่เคยนำมาขายในงานอีเวนต์ รวมถึงรุ่นที่เป็นสินค้าประจำ แต่บางสีมีเฉพาะในอีเวนต์",
    women:"ผู้หญิง", men:"ผู้ชาย", allCats:"ทุกประเภท", search:"ค้นหารุ่น สี หรือรหัส",
    cat:{training:"ยิมและเทรนนิ่ง", running:"เดินและวิ่ง", outdoor:"กลางแจ้ง ริมน้ำ และเทรล", casual:"ใส่ทั่วไปและคาสชวล"},
    nModels:n=>`${n} รุ่น`, tabCount:(m,c)=>`${m} รุ่น · ${c} สี`, count:(m,c)=>`${m} รุ่น / ${c} สี`,
    stModels:"รุ่น", stColours:"สี (แยกชาย/หญิง)", stPrice:"ช่วงราคาปกติ",
    listPrice:"ราคาปกติ", more:"ดูจุดเด่นและรายละเอียด", alsoRegular:"สีอื่นเป็นสินค้าประจำ",
    close:"ปิด", spec:"สเปก", weight:"น้ำหนัก", sole:"พื้นรองเท้า", upper:"ส่วนบน",
    feats:"จุดเด่น", carried:"สีที่ร้านมีจำหน่าย", notCarried:"สีอื่นที่มีในไลน์อัป (ร้านไม่มีจำหน่าย)",
    regular:"ประจำ", event:"อีเวนต์", none:"ไม่มี",
    rangeNote:"สีที่แสดงอยู่บน vibram.com ในขณะนี้ อาจเปลี่ยนแปลงตามฤดูกาล",
    notListed:"รุ่นนี้ไม่มีบน vibram.com จึงไม่สามารถแสดงสีที่ร้านไม่มีจำหน่ายได้",
    noCopy:"รุ่นเก่าที่ไม่มีคำอธิบายเหลือบนเว็บไซต์ทางการ แสดงเฉพาะชื่อ ราคา และสีที่ร้านมีจำหน่าย",
    refModel:"ภาพอ้างอิง (สีอื่น)", refGender:"ภาพอ้างอิง (เพศอื่น)", refPoster:"ภาพจากโปสเตอร์",
    jpSite:"barefootinc.jp", vibSite:"vibram.com",
    empty:"ไม่พบรุ่นที่ตรงกับเงื่อนไข ลองล้างตัวกรองหรือเปลี่ยนคำค้นหา",
    foot:t=>[`การระบุสินค้าที่ร้านมี: ตารางสต็อก (VFF Stock Dashboard ณ ${t}) สีที่มีสต็อกเป็นสินค้าประจำ สีหรือเพศที่ไม่มีสต็อกในตารางนั้นแต่อยู่ในไฟล์สต็อกอีเวนต์ (ก.ย. 2026) เป็นเฉพาะอีเวนต์`,
          "ราคา: ราคาปกติจากไฟล์สต็อกอีเวนต์ (เท่ากับราคาที่ขีดฆ่าก่อนลดบนโปสเตอร์ป๊อปอัพ Terminal 21 Asok)",
          "คำอธิบายและจุดเด่น: vibram.com (อังกฤษ) และ barefootinc.jp (ญี่ปุ่น) ข้อความภาษาไทยเป็นการแปล น้ำหนัก พื้นรองเท้า และส่วนบนตามที่เว็บไซต์ระบุ",
          "รูปภาพ: ภาพสินค้าจาก vibram.com และ barefootinc.jp รุ่นเก่าที่ไม่มีบนทั้งสองเว็บไซต์ใช้ภาพจากโปสเตอร์"],
    g:{W:"ผู้หญิง",M:"ผู้ชาย",U:"ยูนิเซ็กซ์"}
  }
};
const CATS = ["training","running","outdoor","casual"];
const CATNAME = {training:"Training",running:"Running",outdoor:"Outdoor",casual:"Casual"};
const st = {tab:"regular", g:"all", cat:"all", q:"", lang:"ja"};
const sel = {};   // model name -> selected colourway index
let openName = null;
const t = () => T[st.lang];
const fmt = n => n.toLocaleString("en-US");
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const inTab = (cw, tab) => tab === "regular" ? cw.regular : !cw.regular;
const cwId = c => c.g + "|" + c.colour;

function copy(m){ return (m.i18n && m.i18n[st.lang]) || null; }
function spec(m, k){ const s = m.i18n && m.i18n.specs && m.i18n.specs[k]; return s ? (s[st.lang] || "") : ""; }

function cwMatch(m, cw){
  if (!inTab(cw, st.tab)) return false;
  if (st.g !== "all" && cw.g !== st.g && cw.g !== "U") return false;
  if (st.cat !== "all" && m.cat !== st.cat) return false;
  const q = st.q.trim().toLowerCase();
  if (!q) return true;
  const hay = [m.name, cw.colour, cw.code, T.ja.g[cw.g], T.th.g[cw.g]].join(" ").toLowerCase();
  return q.split(/\s+/).every(w => hay.includes(w));
}

function tabCounts(tab){
  const cws = DATA.flatMap(m=>m.cw.filter(c=>inTab(c,tab)).map(()=>m.price));
  const ms = DATA.filter(m=>m.cw.some(c=>inTab(c,tab)));
  return {m: ms.length, c: cws.length, lo: Math.min(...cws), hi: Math.max(...cws)};
}

function renderChrome(){
  const L = t();
  document.documentElement.lang = st.lang;
  document.querySelectorAll("[data-i]").forEach(el => { el.textContent = L[el.dataset.i]; });
  document.getElementById("q").placeholder = L.search;
  document.getElementById("q").setAttribute("aria-label", L.search);
  const asof = (ASOF.match(/\d\d\/\d\d\/\d{4}/) || [""])[0];
  document.getElementById("foot").innerHTML = L.foot(asof).map(s=>`<div>${esc(s)}</div>`).join("");
  document.querySelectorAll("#f-lang button").forEach(b => b.setAttribute("aria-pressed", b.dataset.v === st.lang));
  for (const tb of ["regular","event"]){ const k = tabCounts(tb); document.getElementById("t-"+tb).textContent = L.tabCount(k.m, k.c); }
  const k = tabCounts(st.tab);
  document.getElementById("stats").innerHTML =
    `<div class="stat"><b>${k.m}</b><span>${L.stModels}</span></div>
     <div class="stat"><b>${k.c}</b><span>${L.stColours}</span></div>
     <div class="stat"><b>฿${fmt(k.lo)}${k.lo===k.hi?"":"–"+fmt(k.hi)}</b><span>${L.stPrice}</span></div>`;
  document.getElementById("tabnote").textContent = st.tab === "regular" ? L.noteRegular : L.noteEvent;
  document.querySelectorAll("#tabs a").forEach(a => {
    if (a.dataset.tab === st.tab) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
  });
}

function refChip(cw){
  const L = t();
  if (cw.ref === "model") return `<span class="refnote">${L.refModel}</span>`;
  if (cw.ref === "gender") return `<span class="refnote">${L.refGender}</span>`;
  if (cw.img_src === "poster") return `<span class="refnote">${L.refPoster}</span>`;
  return "";
}
function priceHTML(m){
  return `<div class="price"><span class="now">฿${fmt(m.price)}</span><span class="unit">${t().listPrice}</span></div>`;
}

function card(m, cws){
  const L = t(), cp = copy(m);
  const cur = cws.find(c=>cwId(c)===sel[m.name]) || cws[0];
  sel[m.name] = cwId(cur);
  return `<article class="card" data-m="${esc(m.name)}">
    <button class="photo" data-open="${esc(m.name)}" aria-label="${esc(m.name)}">
      ${cur.imgs[0]?`<img src="${cur.imgs[0]}" alt="${esc(m.name)} ${esc(cur.colour)}" loading="lazy">`:""}
      ${refChip(cur)}
    </button>
    <div class="body">
      <div><h3 class="name">${esc(m.name)}</h3></div>
      ${cp&&cp.tagline?`<p class="tag">${esc(cp.tagline)}</p>`:""}
      <div class="swatches" role="group">${cws.map(c=>`<button class="sw${c.ref?" txt":""}" data-cw="${esc(cwId(c))}" aria-pressed="${cwId(c)===cwId(cur)}" title="${esc(c.colour)} (${L.g[c.g]})">${c.ref?`<span>${esc(c.colour)}</span>`:`<img src="${c.imgs[0]||""}" alt="" loading="lazy">`}<i>${c.g}</i></button>`).join("")}</div>
      <div class="cwname"><b>${esc(cur.colour)}</b><span class="gpill">${L.g[cur.g]}</span><span class="gpill">${esc(cur.code)}</span></div>
      ${priceHTML(m)}
      ${st.tab==="event" && m.cw.some(c=>c.regular)?`<span class="also">${L.alsoRegular}</span>`:""}
      <button class="more" data-open="${esc(m.name)}">${L.more}</button>
    </div>
  </article>`;
}

function render(){
  const L = t(), out = [];
  let nM = 0, nC = 0;
  for (const cat of CATS){
    const cards = [];
    for (const m of DATA.filter(m=>m.cat===cat)){
      const cws = m.cw.filter(c=>cwMatch(m,c));
      if (!cws.length) continue;
      nM++; nC += cws.length;
      cards.push(card(m, cws));
    }
    if (cards.length) out.push(`<section class="cat"><h2>${CATNAME[cat]}<small>${L.cat[cat]} · ${L.nModels(cards.length)}</small></h2><div class="grid">${cards.join("")}</div></section>`);
  }
  document.getElementById("list").innerHTML = out.join("") || `<p class="empty">${L.empty}</p>`;
  document.getElementById("count").textContent = L.count(nM, nC);
}

function rangeHTML(m){
  const L = t();
  const pills = (r, want) => ["W","M"].filter(g => g in r && want(r[g])).map(g =>
    `<span class="gp ${r[g]==="regular"?"r":r[g]==="event"?"e":"n"}">${g}${r[g]?` · ${r[g]==="regular"?L.regular:L.event}`:""}</span>`).join("");
  const carried = m.range.filter(r => ["W","M"].some(g => r[g]));
  const other = m.range.filter(r => ["W","M"].some(g => g in r && !r[g]));
  const list = (rows, want) => rows.length
    ? `<ul class="range">${rows.map(r=>`<li><span>${esc(r.name)}</span><span class="gps">${pills(r, want)}</span></li>`).join("")}</ul>`
    : `<p class="muted">${L.none}</p>`;
  return `<div><p class="sec">${L.carried}</p>${list(carried, v => !!v)}</div>
    <div><p class="sec">${L.notCarried}</p>${list(other, v => !v)}
      <p class="muted small">${m.listed ? L.rangeNote : L.notListed}</p></div>`;
}

function openModel(name){
  const L = t(), m = DATA.find(x=>x.name===name), cp = copy(m);
  openName = name;
  const cur = m.cw.find(c=>cwId(c)===sel[name]) || m.cw[0];
  const specs = [[L.weight, spec(m,"weight")],[L.sole, spec(m,"sole")],[L.upper, spec(m,"upper")]].filter(s=>s[1]);
  const links = [m.vib_url && `<a href="${m.vib_url}" target="_blank" rel="noopener">${L.vibSite}</a>`,
                 m.jp_url && `<a href="${m.jp_url}" target="_blank" rel="noopener">${L.jpSite}</a>`].filter(Boolean);
  const dlg = document.getElementById("dlg");
  dlg.setAttribute("aria-label", m.name);
  dlg.innerHTML = `<div class="dlg">
    <div class="gal">
      <div class="main"><img id="dmain" src="${cur.imgs[0]||""}" alt="${esc(m.name)} ${esc(cur.colour)}">${refChip(cur)}</div>
      <div class="thumbs" id="dthumbs">${cur.imgs.length>1?cur.imgs.map((s,i)=>`<button data-img="${s}" aria-pressed="${i===0}" aria-label="${i+1}"><img src="${s}" alt=""></button>`).join(""):""}</div>
      <div class="swatches">${m.cw.map(c=>`<button class="sw${c.ref?" txt":""}" data-dcw="${esc(cwId(c))}" aria-pressed="${cwId(c)===cwId(cur)}" title="${esc(c.colour)} (${L.g[c.g]})">${c.ref?`<span>${esc(c.colour)}</span>`:`<img src="${c.imgs[0]||""}" alt="">`}<i>${c.g}</i></button>`).join("")}</div>
      <div class="cwname" style="color:#15161A"><b>${esc(cur.colour)}</b><span>${L.g[cur.g]} · ${esc(cur.code)}</span><span class="kind ${cur.regular?"r":"e"}">${cur.regular?L.regular:L.event}</span></div>
    </div>
    <div class="info">
      <button class="close" id="dclose">${L.close}</button>
      <div><div class="eyebrow">${CATNAME[m.cat]}</div><h3>${esc(m.name)}</h3></div>
      ${priceHTML(m)}
      ${cp&&cp.tagline?`<p class="lead"><b>${esc(cp.tagline)}</b></p>`:""}
      ${cp&&cp.intro?`<p class="lead">${esc(cp.intro)}</p>`:`<div class="note">${L.noCopy}</div>`}
      ${specs.length?`<div><p class="sec">${L.spec}</p><dl class="specs">${specs.map(([k,v])=>`<div class="wide"><dt>${k}</dt><dd>${esc(v)}</dd></div>`).join("")}</dl></div>`:""}
      ${cp&&cp.feats&&cp.feats.length?`<div><p class="sec">${L.feats}</p><ul class="feats">${cp.feats.map(f=>`<li>${f.t?`<b>${esc(f.t)}</b>`:""}${esc(f.d)}</li>`).join("")}</ul></div>`:""}
      ${rangeHTML(m)}
      ${links.length?`<div class="links">${links.join("")}</div>`:""}
    </div></div>`;
  if (!dlg.open) dlg.showModal();
  dlg.querySelector(".info").scrollTop = 0;
}

document.addEventListener("click", e => {
  const sw = e.target.closest(".card .sw");
  if (sw){ sel[sw.closest(".card").dataset.m] = sw.dataset.cw; render(); return; }
  const op = e.target.closest("[data-open]");
  if (op){ openModel(op.dataset.open); return; }
  const dsw = e.target.closest("[data-dcw]");
  if (dsw){ sel[openName] = dsw.dataset.dcw; openModel(openName); render(); return; }
  const th = e.target.closest("[data-img]");
  if (th){ document.getElementById("dmain").src = th.dataset.img; document.querySelectorAll("#dthumbs button").forEach(b=>b.setAttribute("aria-pressed", b===th)); return; }
  if (e.target.id === "dclose" || e.target.id === "dlg") document.getElementById("dlg").close();
});
document.getElementById("dlg").addEventListener("close", () => { openName = null; });
for (const [id,key] of [["f-g","g"],["f-cat","cat"]]){
  document.getElementById(id).addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    st[key] = b.dataset.v;
    b.parentElement.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed", x===b));
    render();
  });
}
document.getElementById("f-lang").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  st.lang = b.dataset.v;
  try { localStorage.setItem("fivefingers-lineup-lang", st.lang); } catch (_) {}
  renderChrome(); render();
  if (openName) openModel(openName);
});
document.getElementById("q").addEventListener("input", e => { st.q = e.target.value; render(); });

function setTab(tb){
  st.tab = tb === "event" ? "event" : "regular";
  renderChrome(); render();
}
document.getElementById("tabs").addEventListener("click", e => {
  const a = e.target.closest("a[data-tab]"); if (!a) return;
  e.preventDefault();
  try { history.replaceState(null, "", "#" + a.dataset.tab); } catch (_) {}
  setTab(a.dataset.tab);
});
window.addEventListener("hashchange", () => setTab(location.hash.slice(1)));

(function initLang(){
  let saved = null;
  try { saved = localStorage.getItem("fivefingers-lineup-lang"); } catch (_) {}
  const nav = (navigator.language || "").toLowerCase();
  st.lang = T[saved] ? saved : nav.startsWith("th") ? "th" : nav.startsWith("ja") ? "ja" : "en";
})();
setTab(location.hash.slice(1));
</script>
